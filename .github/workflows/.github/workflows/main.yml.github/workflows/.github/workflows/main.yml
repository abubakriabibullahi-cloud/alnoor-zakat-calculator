name: Build Al-Noor Zakat Calculator APK

on:
workflow_dispatch:
push:
paths:
- 'app/'
- 'gradle/'
- '.gradle'
- '.gradle.kts'
- 'gradlew'
- 'gradle.properties'
- 'settings.gradle'
- 'settings.gradle.kts'
- '.github/workflows/main.yml'

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Check Gradle wrapper
    run: |
      if [ ! -f "./gradlew" ]; then
        echo "ERROR: gradlew is missing from the repository root."
        exit 1
      fi
      chmod +x ./gradlew

  - name: Build debug APK
    run: ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AlNoor-Zakat-Calculator-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
